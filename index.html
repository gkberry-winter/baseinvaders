  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.5;

  .wrap{max-width:760px;margin:0 auto;padding:0 16px 64px}
  a{color:var(--blue);text-decoration:none}

  .eyebrow{font-family:var(--pixel);font-size:9px;letter-spacing:1px;color:var(--gold);text-transform:uppercase}

    border-bottom:1px solid var(--line)}

    background:repeating-linear-gradient(rgba(0,0,0,0) 0 2px, rgba(0,0,0,.10) 2px 3px)}
  .hero>*{position:relative;z-index:1}
  .invader{display:block;margin:0 auto 14px}
  .teamname{font-family:var(--pixel);font-size:clamp(20px,6.4vw,40px);line-height:1.25;color:var(--text);
    text-shadow:3px 3px 0 var(--navy)}
  .teamname b{color:var(--gold);text-shadow:3px 3px 0 #5a4a06}
  .sub{font-family:var(--pixel);font-size:8px;letter-spacing:1px;color:var(--muted);margin-top:14px}

  .scoreboard{display:flex;align-items:stretch;justify-content:center;gap:10px;margin:26px auto 6px;flex-wrap:wrap}
  .sb-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;min-width:96px}
  .sb-card .label{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
  .sb-card .val{font-family:var(--mono);font-weight:700;font-size:30px;color:var(--text);margin-top:2px}
  .sb-card.rank .val{color:var(--gold)}
  .sb-card .val small{font-size:14px;color:var(--muted);font-weight:500}

  .nextgame{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
    background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:0 8px 8px 0;
    padding:12px 16px;margin:18px auto 0;max-width:560px;text-align:left}
  .nextgame .tag{font-family:var(--pixel);font-size:8px;color:var(--gold);letter-spacing:1px}
  .nextgame .matchup{font-size:18px;font-weight:600}
  .nextgame .det{font-size:13px;color:var(--muted)}
  .nextgame .det .num{color:var(--text)}

  .marchers{display:flex;gap:14px;justify-content:center;margin:24px 0 8px;opacity:.5}

  /* SECTIONS */
  section{margin-top:34px}
  .sec-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .sec-head h2{font-family:var(--pixel);font-size:12px;letter-spacing:1px;color:var(--text);text-transform:uppercase;font-weight:400}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}

  /* TABLES */
  table{width:100%;border-collapse:collapse}
  .scroll{overflow-x:auto}
  th{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:600;
    text-align:right;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:center}
  th.l,td.l{text-align:left}
  td{padding:9px 10px;font-size:13px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  tr:last-child td{border-bottom:none}
  .tnum{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .rk{color:var(--dim);font-family:var(--mono);width:30px}
  tr.me td{background:rgba(245,197,24,.10)}
  tr.me td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
  tr.me td.l{color:var(--gold);font-weight:600}
  .pos{color:var(--win)} .neg{color:var(--loss)}
  .strk-w{color:var(--win)} .strk-l{color:var(--loss)} .strk-t{color:var(--tie)}

  .games{display:flex;flex-direction:column}
  .game{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
  .game:last-child{border-bottom:none}
  .game .date{font-family:var(--mono);font-size:12px;color:var(--muted);width:54px;flex:none}
  .game .opp{flex:1;font-size:14px;font-weight:500}
  .game .opp .ha{color:var(--dim);font-weight:400;margin-right:4px}
  .game .score{font-family:var(--mono);font-weight:600;font-size:15px;width:64px;text-align:right}
  .badge{font-family:var(--pixel);font-size:8px;padding:4px 6px;border-radius:4px;width:24px;text-align:center;flex:none}
  .b-w{background:rgba(52,215,127,.16);color:var(--win)}
  .b-l{background:rgba(239,93,107,.16);color:var(--loss)}
  .b-t{background:rgba(154,163,184,.16);color:var(--tie)}
  .upcoming .game .opp{font-weight:500}
  .upcoming .when{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none}

  /* LEADERS */
  .leaders{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
  .lead{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .lead h3{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px}
  .lead ol{list-style:none}
  .lead li{display:flex;align-items:baseline;gap:8px;padding:5px 0;font-size:14px}
  .lead li .p{font-family:var(--mono);color:var(--dim);font-size:12px;width:14px}
  .lead li .nm{flex:1}
  .lead li .v{font-family:var(--mono);font-weight:600}
  .lead li:first-child .p{color:var(--gold)}
  .lead li:first-child .nm{color:var(--gold);font-weight:600}

  .foot{margin-top:40px;text-align:center;font-size:12px;color:var(--dim);line-height:1.9}
  .foot .eyebrow{display:block;margin-bottom:6px}
  .cta{display:inline-block;margin-top:6px;background:var(--navy);color:#fff;font-weight:600;font-size:13px;
    padding:9px 18px;border-radius:6px}
  @media (prefers-reduced-motion:no-preference){
    .live{animation:blink 1.4s steps(1) infinite}
    @keyframes blink{50%{opacity:.25}}
  }
  /* TEAM BATTING STRIP */
  .statstrip{display:flex;justify-content:center;flex-wrap:wrap;margin:12px auto 0;max-width:560px;

  .statstrip .s:last-child{border-right:none}
  .statstrip .s .k{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
  .statstrip .s .v{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--text);margin-top:3px}
  .statstrip .s.gold .v{color:var(--gold)}

  /* FORM BAR */
  .formbar{display:flex;gap:5px;justify-content:center;align-items:center;margin:16px auto 0;flex-wrap:wrap}
  .formbar .pip{width:22px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;

  .formbar .pip.w{background:var(--win)} .formbar .pip.l{background:var(--loss)} .formbar .pip.t{background:var(--tie)}
  .formbar .pip.last{outline:2px solid var(--gold);outline-offset:2px}

  /* FEATURED RECAP */
  .recap-card{padding:18px 20px}
  .recap-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .recap-badge{font-family:var(--pixel);font-size:9px;padding:6px 9px;border-radius:5px}
  .recap-score{font-family:var(--mono);font-weight:700;font-size:30px}
  .recap-score .them{color:var(--muted)}
  .recap-meta{flex:1;min-width:140px}
  .recap-meta .opp{font-size:15px;font-weight:600}

  .recap-text{font-size:14px;color:var(--text);line-height:1.65;margin:0 0 10px}
  .recap-text:last-child{margin-bottom:0}

  .lead li .p{color:var(--dim);font-size:12px;width:20px}
  .lead li .nm{text-transform:uppercase;letter-spacing:.5px}
  .lead li .v{color:var(--text)}
  .lead li:first-child .v{color:var(--gold)}

  tr.roster-row:hover td{background:rgba(255,255,255,.04)}
  .cardModal{position:fixed;inset:0;background:rgba(5,8,18,.80);display:flex;align-items:center;justify-content:center;

  .cardModal[hidden]{display:none}
  .card-inner{background:var(--panel2);border:1px solid var(--line2);border-radius:14px;max-width:340px;width:100%;

  .card-x{position:absolute;top:9px;right:13px;font-family:var(--pixel);font-size:11px;color:var(--muted);cursor:pointer}

  .pc-head svg{display:block;margin:0 auto}
  .pc-name{font-family:var(--pixel);font-size:13px;color:var(--gold);margin-top:10px;line-height:1.4}
  .pc-line{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:8px}
  .pc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .pc-grid .c{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center}
  .pc-grid .c .k{font-size:9px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px}
  .pc-grid .c .v{font-family:var(--mono);font-weight:700;font-size:16px;margin-top:3px}
  .pc-badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .pc-badge{font-family:var(--mono);font-size:11px;font-weight:600;padding:4px 8px;border-radius:6px;

  .pc-badge.silver{background:rgba(255,255,255,.06);color:var(--text);border-color:var(--line2)}
  .pc-spotlight{margin-top:14px;border-top:1px dashed var(--line2);padding-top:12px}
  .pc-spot-load{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .pc-spot-load::after{content:"_";animation:pcblink 1s steps(1) infinite}
  @keyframes pcblink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.pc-spot-load::after{animation:none}}
  .pc-spot-text{font-size:13px;color:var(--text);line-height:1.6;margin:0}
  .pc-spot-label{font-family:var(--pixel);font-size:8px;color:var(--gold);letter-spacing:1px;display:block;margin-bottom:7px}

    .sb-card{padding:12px 14px;min-width:84px}
    .sb-card .val{font-size:26px}
    .game .date{width:48px}

/* classic invader bitmap → SVG */
const SPRITE=["00100000100","00010001000","00111111100","01101110110","11111111111","10111111101","10100000101","00011011000"];
function invaderSVG(el,color,cell){
  const cols=SPRITE[0].length, rows=SPRITE.length;
  el.setAttribute("viewBox",`0 0 ${cols*cell} ${rows*cell}`);
  let r="";
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++) if(SPRITE[y][x]==="1")
    r+=`<rect x="${x*cell}" y="${y*cell}" width="${cell}" height="${cell}" fill="${color}"/>`;
  el.innerHTML=r;
}
function miniInvader(color){
  const c=2,cols=SPRITE[0].length,rows=SPRITE.length;
  let r="";for(let y=0;y<rows;y++)for(let x=0;x<cols;x++) if(SPRITE[y][x]==="1")
    r+=`<rect x="${x*c}" y="${y*c}" width="${c}" height="${c}" fill="${color}"/>`;
  return `<svg width="22" height="16" viewBox="0 0 ${cols*c} ${rows*c}">${r}</svg>`;
}

const esc=s=>String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
const fmt3=n=>n==null?"—":n.toFixed(3).replace(/^0/,"");
const fmtAvg=n=>n==null?"—":n.toFixed(3).replace(/^0/,"");
const strkClass=s=>!s||s==="—"?"strk-t":s[0]==="W"?"strk-w":s[0]==="L"?"strk-l":"strk-t";
const ha=h=>h?'<span class="ha">vs</span>':'<span class="ha">@</span>';

let CURRENT=null;
function miniInvaderBig(color){
  const c=4,cols=SPRITE[0].length,rows=SPRITE.length;
  let r="";for(let y=0;y<rows;y++)for(let x=0;x<cols;x++) if(SPRITE[y][x]==="1")
    r+=`<rect x="${x*c}" y="${y*c}" width="${c}" height="${c}" fill="${color}"/>`;
  return `<svg width="44" height="32" viewBox="0 0 ${cols*c} ${rows*c}">${r}</svg>`;
}

function render(D){
  CURRENT=D;
  invaderSVG(document.getElementById("bigInvader"),"#f5c518",6);
  document.getElementById("marchers").innerHTML =
    [..."0000"].map(()=>miniInvader("#3a4a6b")).join("");

  const rec=D.record, st=D.standing;
  document.getElementById("scoreboard").innerHTML=`
    <div class="sb-card"><div class="label">Record</div><div class="val">${rec.w}<small>–</small>${rec.l}${rec.t?`<small>–</small>${rec.t}`:""}</div></div>
    <div class="sb-card"><div class="label">Win %</div><div class="val">${Math.round(rec.winPct*1000)/10}<small>%</small></div></div>
    <div class="sb-card rank"><div class="label">League</div><div class="val">#${st.rank}<small> / ${st.totalTeams}</small></div></div>`;

  /* team batting strip */
  const tb=D.teamBatting, tbEl=document.getElementById("teamBatting");
  if(tb){ tbEl.hidden=false; tbEl.innerHTML=`
    <div class="s"><div class="k">Team AVG</div><div class="v">${fmtAvg(tb.avg)}</div></div>
    <div class="s"><div class="k">Team OPS</div><div class="v">${tb.ops?tb.ops.toFixed(3):"—"}</div></div>
    <div class="s gold"><div class="k">Home Runs</div><div class="v">${tb.hr}</div></div>
    <div class="s gold"><div class="k">Runs</div><div class="v">${tb.runs}</div></div>`; }
  else tbEl.hidden=true;

  /* form bar — oldest→newest, newest highlighted */
  const fb=document.getElementById("formbar");
  if(D.results&&D.results.length){ fb.hidden=false;
    fb.innerHTML=D.results.map((g,i)=>{
      const cls=g.res==="W"?"w":g.res==="L"?"l":"t";
      const last=i===D.results.length-1?" last":"";
      const title=`${g.date} ${g.home?"vs":"@"} ${g.opp} ${g.us}–${g.them} ${g.res}`;
      return `<span class="pip ${cls}${last}" title="${esc(title)}">${g.res}</span>`;
    }).join("");
  } else fb.hidden=true;

  /* featured last-game recap */
  const lr=(D.results&&D.results.length)?D.results[D.results.length-1]:null;
  const recapSec=document.getElementById("recapSec");
  if(lr&&D.recap){ recapSec.hidden=false;
    const b=lr.res==="W"?"b-w":lr.res==="L"?"b-l":"b-t";
    const word=lr.res==="W"?"WIN":lr.res==="L"?"LOSS":"TIE";
    document.getElementById("recapCard").innerHTML=`
      <div class="recap-top">
        <span class="recap-badge ${b}">${word}</span>
        <span class="recap-score"><span class="us">${lr.us}</span><span style="color:var(--dim)">–</span><span class="them">${lr.them}</span></span>
        <span class="recap-meta"><div class="opp">${ha(lr.home)} ${esc(lr.opp)}</div><div class="date">${esc(lr.date)}</div></span>
      </div>
      ${String(D.recap).split(/\n\n+/).map(par=>`<p class="recap-text">${esc(par.replace(/\n/g," "))}</p>`).join("")}`;
  } else recapSec.hidden=true;

  const ng=D.nextGame, ngEl=document.getElementById("nextgame");
  if(ng){ ngEl.hidden=false; ngEl.innerHTML=`
    <span class="tag">NEXT ▸</span>
    <span class="matchup">${ha(ng.home)} ${esc(ng.opponent)}</span>
    <span class="det"><span class="num">${esc(ng.date)}</span>${ng.time?` · <span class="num">${esc(ng.time)}</span>`:""}${ng.park?` · ${esc(ng.park)}`:""}</span>`; }

  /* standings */
  let s=`<thead><tr><th>#</th><th class="l">Team</th><th>W-L-T</th><th>Diff</th><th>Strk</th></tr></thead><tbody>`;
  D.standingsTable.forEach(t=>{
    const me=t.team===D.team?" class=\"me\"":"";
    const d=(t.diff>0?"+":"")+t.diff;
    s+=`<tr${me}><td class="rk">${t.rank}</td><td class="l">${esc(t.team)}</td>`+
       `<td class="tnum">${t.w}-${t.l}-${t.t}</td>`+
       `<td class="tnum ${t.diff>0?"pos":t.diff<0?"neg":""}">${d}</td>`+
       `<td class="tnum ${strkClass(t.strk)}">${t.strk}</td></tr>`;
  });
  document.getElementById("standings").innerHTML=s+"</tbody>";

  /* results (most recent first) */
  document.getElementById("results").innerHTML=[...D.results].reverse().map(g=>{
    const b=g.res==="W"?"b-w":g.res==="L"?"b-l":"b-t";
    return `<div class="game"><span class="date">${esc(g.date)}</span>`+
      `<span class="opp">${ha(g.home)} ${esc(g.opp)}</span>`+
      `<span class="score">${g.us}–${g.them}</span>`+
      `<span class="badge ${b}">${g.res}</span></div>`;
  }).join("")||`<div class="game"><span class="opp" style="color:var(--muted)">No games played yet.</span></div>`;

  /* schedule */
  document.getElementById("schedule").innerHTML=D.schedule.map(g=>
    `<div class="game"><span class="date">${esc(g.date)}</span>`+
    `<span class="opp">${ha(g.home)} ${esc(g.opp)}</span>`+
    `<span class="when">${g.home?"Home":"Away"}</span></div>`).join("");

  /* leaders */
  document.getElementById("leaders").innerHTML=Object.entries(D.leaders).map(([cat,rows])=>
    `<div class="lead"><h3>${esc(cat)}</h3><ol>`+
    rows.map((r,i)=>`<li><span class="p">${i+1}</span><span class="nm">${esc(r[0])}</span><span class="v">${esc(r[1])}</span></li>`).join("")+
    `</ol></div>`).join("");

  /* roster — sorted by OPS desc, unplayed/dash last */
  const ps=[...D.players].sort((a,b)=>(b.ops??-1)-(a.ops??-1));
  let r=`<thead><tr><th class="l">Player</th><th>GP</th><th>AB</th><th>H</th><th>HR</th><th>RBI</th><th>R</th><th>AVG</th><th>OPS</th></tr></thead><tbody>`;
  ps.forEach(p=>{
    r+=`<tr class="roster-row" data-name="${esc(p.name)}"><td class="l">${esc(p.name)}</td><td class="tnum">${p.gp}</td><td class="tnum">${p.ab}</td>`+
       `<td class="tnum">${p.h}</td><td class="tnum">${p.hr}</td><td class="tnum">${p.rbi}</td><td class="tnum">${p.r}</td>`+
       `<td class="tnum">${fmtAvg(p.avg)}</td><td class="tnum">${p.ops==null?"—":p.ops.toFixed(3)}</td></tr>`;
  });
  document.getElementById("roster").innerHTML=r+"</tbody>";
  const sb=document.getElementById("sheetBtn");
  if(sb) sb.innerHTML=D.sheetUrl?`<a class="cta" href="${esc(D.sheetUrl)}">View Full Stats Sheet</a>`:"";

  document.getElementById("foot").innerHTML=
    `<span class="eyebrow live">▸ updated ${esc(D.updated||"")}</span>`+
    `Standings & schedule auto-synced from <a href="${esc(D.leagueUrl||"#")}">NorthShore Unlimited</a>.`+
    (D.sheetUrl?`<br><a class="cta" href="${esc(D.sheetUrl)}">View Full Stats Sheet</a>`:"");
}

/* ---- Player card (tap a batting row) ---- */
function rankOf(players,key,name){
  const sorted=[...players].filter(x=>x[key]!=null).sort((a,b)=>b[key]-a[key]);
  const i=sorted.findIndex(x=>x.name===name);
  return i===-1?null:i+1;
}
function openPlayerCard(name){
  const D=CURRENT; if(!D) return;
  const p=D.players.find(x=>x.name===name); if(!p) return;
  const avgS=p.avg==null?"—":p.avg.toFixed(3).replace(/^0/,"");
  const opsS=p.ops==null?"—":p.ops.toFixed(3);
  const metrics=[["OPS","ops"],["AVG","avg"],["Hits","h"],["RBI","rbi"],["Runs","r"],["HR","hr"]];
  const badges=[];
  metrics.forEach(([lab,key])=>{
    if(key==="hr"&&(p.hr||0)===0) return;
    if((p[key]||0)===0 && key!=="avg" && key!=="ops") return;
    const rk=rankOf(D.players,key,name);
    if(rk&&rk<=3) badges.push({t:"#"+rk+" "+lab,gold:rk===1});
  });
  document.getElementById("cardInner").innerHTML=`
    <span class="card-x" id="cardX">&#10005;</span>
    <div class="pc-head">
      ${miniInvaderBig("#f5c518")}
      <div class="pc-name">${esc(p.name.toUpperCase())}</div>
      <div class="pc-line">${p.gp} GP &middot; ${avgS} AVG &middot; ${opsS} OPS</div>
    </div>
    <div class="pc-grid">
      <div class="c"><div class="k">AB</div><div class="v">${p.ab}</div></div>
      <div class="c"><div class="k">H</div><div class="v">${p.h}</div></div>
      <div class="c"><div class="k">HR</div><div class="v">${p.hr}</div></div>
      <div class="c"><div class="k">RBI</div><div class="v">${p.rbi}</div></div>
      <div class="c"><div class="k">R</div><div class="v">${p.r}</div></div>
      <div class="c"><div class="k">AVG</div><div class="v">${avgS}</div></div>
      <div class="c" style="grid-column:span 2"><div class="k">OPS</div><div class="v">${opsS}</div></div>
    </div>
    ${badges.length?`<div class="pc-badges">${badges.map(b=>`<span class="pc-badge ${b.gold?"":"silver"}">${esc(b.t)}</span>`).join("")}</div>`:""}
    <div class="pc-spotlight" id="pcSpot"><span class="pc-spot-load">Scouting report incoming</span></div>`;
  document.getElementById("cardModal").hidden=false;
  document.getElementById("cardX").onclick=closeCard;
  fetchSpotlight(p.name);
}
async function fetchSpotlight(name){
  const el=document.getElementById("pcSpot"); if(!el) return;        // captured for THIS card
  try{
    const r=await fetch("/.netlify/functions/spotlight?player="+encodeURIComponent(name));
    if(!r.ok) throw 0;
    const j=await r.json();
    if(j&&j.spotlight){ el.innerHTML=`<span class="pc-spot-label">Scouting Report</span><p class="pc-spot-text">${esc(j.spotlight)}</p>`; return; }
    throw 0;
  }catch(_){ el.style.display="none"; }   // no backend / error → hide quietly, card still works
}
function closeCard(){ document.getElementById("cardModal").hidden=true; }

document.getElementById("roster").addEventListener("click",e=>{
  const tr=e.target.closest("tr.roster-row"); if(tr&&tr.dataset.name) openPlayerCard(tr.dataset.name);
});
document.getElementById("cardModal").addEventListener("click",e=>{ if(e.target.id==="cardModal") closeCard(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeCard(); });

/* render fallback immediately, then override with live data.json if present */
render(FALLBACK);
fetch("data.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{if(d)render(d);}).catch(()=>{});
</script>
